name: "Copy Image"
description: "Copy image to other repositories"
author: "GarnerCorp"
branding:
  icon: "copy"
  color: "green"
inputs:
  source:
    description: "Source image"
    required: true
  destinations:
    description: "Destination image names (space delimited)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      if: ${{ !inputs.source || !inputs.destinations }}
      uses: $/report-missing-inputs
      with:
        inputs: ${{ toJSON(inputs) }}
        action-path: ${{ github.action_path }}

    - name: Add google registries
      shell: bash
      env:
        registries: >-
          ${{ inputs.source }}
          ${{ inputs.destinations }}
      run: |
        : Configure docker gcloud credential helpers if they are not already configured
        "$GITHUB_ACTION_PATH/../scripts/gcloud-auth-configure-docker.sh"

    - name: Install crane
      uses: $/install-crane

    - name: Copy image
      shell: bash
      env:
        source: ${{ inputs.source }}
        destinations: ${{ inputs.destinations }}
      run: |
        : Copy images
        "$GITHUB_ACTION_PATH/copy-images.sh" "Copied images"
