name: "Tag Images"
description: "Add tags to images"
author: "GarnerCorp"
branding:
  icon: "bookmark"
  color: "yellow"
inputs:
  repositories:
    description: "Repositories (space delimited)"
    required: true
  source-tag:
    description: "Source tag"
    required: true
  new-tags:
    description: "For each repository in repositories, for each new-tag in new-tags, add new-tag to the repository with tag source-tag (space delimited)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      if: ${{ !inputs.repositories || !inputs.source-tag || !inputs.new-tags }}
      uses: $/report-missing-inputs
      with:
        inputs: ${{ toJSON(inputs) }}
        action-path: ${{ github.action_path }}

    - name: Add google registries
      shell: bash
      env:
        registries: >-
          ${{ inputs.repositories }}
      run: |
        : Configure docker gcloud credential helpers if they are not already configured
        "$GITHUB_ACTION_PATH/../scripts/gcloud-auth-configure-docker.sh"

    - name: Install crane
      uses: $/install-crane

    - name: Add tags to images
      shell: bash
      env:
        repositories: ${{ inputs.repositories }}
        source_tag: ${{ inputs.source-tag }}
        tags: ${{ inputs.new-tags }}
      run: |
        : Copy images
        summary_label="Tagged images"
        for repository in $repositories; do
          destinations=""
          for tag in $tags; do
            destinations="$destinations $repository:$tag"
          done
          source="$repository:$source_tag" destinations="$destinations" \
            "$GITHUB_ACTION_PATH/../copy-image/copy-images.sh" "$summary_label"
          summary_label=""
        done
