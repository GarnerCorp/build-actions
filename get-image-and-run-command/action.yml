name: 'Get Image and Run Command'
description: 'Get an image and run a command (that presumably relies on the image)'
author: 'GarnerCorp'
branding:
  icon: 'codesandbox'
  color: 'blue'
inputs:
  image:
    description: "An image reference to be pulled by docker"
    required: true
    default: "busybox"
  command:
    description: "The command to run"
    required: false
  checkout:
    description: "Whether to check out the repository"
    required: false
  show-output-on-success:
    description: "Whether to show the output from the command on success in the job summary"
    required: false

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      if: ${{ !inputs.image }}
      uses: $/report-missing-inputs
      with:
        inputs: ${{ toJSON(inputs) }}
        action-path: ${{ github.action_path }}

    - name: Checkout
      id: checkout
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v7

    - name: Run command
      id: run-command
      env:
        IMAGE: ${{ inputs.image }}
        CMD: ${{ inputs.command }}
        SHOW_OUTPUT_ON_SUCCESS: ${{ inputs.show-output-on-success }}
      shell: bash
      run: |
        : 'Run command and report errors'
        if docker pull "$IMAGE"; then
          :
        else
           exit_code="$?"
           echo "# docker pull '$IMAGE' failed; check the workflow's registry login" >> "$GITHUB_STEP_SUMMARY"
           exit $exit_code
        fi

        stdout_file=$(mktemp)
        stderr_file=$(mktemp)

        summarize() {
          (
            echo "## $1"
            echo
            echo '```'
            cat "$2"
            echo '```'
            echo
          ) >> $GITHUB_STEP_SUMMARY
        }

        if bash -c "$CMD" > "$stdout_file" 2> "$stderr_file"; then
          if [ "$SHOW_OUTPUT_ON_SUCCESS" == "true" ]; then
            summarize output $stdout_file
          fi
        else
          exit_code="$?"
          summarize output $stdout_file
          summarize error $stderr_file
          echo 'Errors detected: See summary for error report'
          exit "$exit_code"
        fi
